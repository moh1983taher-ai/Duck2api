name: Go CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -mod=mod ./...

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Build
        run: go build -mod=mod ./...

      - name: Export resolved checksums for dependency review
        run: cat go.sum
