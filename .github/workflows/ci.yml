name: Go CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -mod=mod ./...

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Build
        run: go build -mod=mod ./...

      - name: Discover live Aljam3 and Shamela MCP catalogs (read-only)
        env:
          MCP_LIVE_DISCOVERY: "1"
          MCP_SERVERS: >-
            [{"server_label":"aljam3","server_url":"https://aljam3.com/mcp","allow_read_only_tools":true,"require_approval":"never"},{"server_label":"shamela","server_url":"https://mcp.shamela.ws","allow_read_only_tools":true,"require_approval":"never"}]
        run: go test -mod=mod -v -count=1 ./internal/mcpbridge -run '^TestLiveResearchServerDiscovery
