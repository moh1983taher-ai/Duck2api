name: Go CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -mod=mod ./...

      - name: Vet
        run: go vet -mod=mod ./...

      - name: Build
        run: go build -mod=mod ./...

      - name: Discover live Aljam3 and Shamela MCP catalogs (read-only)
        env:
          MCP_LIVE_DISCOVERY: "1"
          MCP_SERVERS: >-
            [{"server_label":"aljam3","server_url":"https://aljam3.com/mcp","allow_read_only_tools":true,"require_approval":"never"},{"server_label":"shamela","server_url":"https://mcp.shamela.ws","allow_read_only_tools":true,"require_approval":"never"}]
        run: go test -mod=mod -v -count=1 ./internal/mcpbridge -run TestLiveResearchServerDiscovery

      - name: Execute one live read-only search in each MCP library
        env:
          MCP_LIVE_DISCOVERY: "1"
          MCP_SERVERS: >-
            [{"server_label":"aljam3","server_url":"https://aljam3.com/mcp","allow_read_only_tools":true,"require_approval":"never"},{"server_label":"shamela","server_url":"https://mcp.shamela.ws","allow_read_only_tools":true,"require_approval":"never"}]
        run: go test -mod=mod -v -count=1 ./internal/mcpbridge -run TestLiveReadOnlyResearchToolCalls

      - name: End-to-end DuckAI Responses MCP orchestration
        env:
          SERVER_HOST: "127.0.0.1"
          SERVER_PORT: "18083"
          MCP_MAX_TOOL_CALLS: "1"
          MCP_SERVERS: >-
            [{"server_label":"aljam3","server_url":"https://aljam3.com/mcp","allow_read_only_tools":true,"require_approval":"never"},{"server_label":"shamela","server_url":"https://mcp.shamela.ws","allow_read_only_tools":true,"require_approval":"never"}]
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          go build -mod=mod -o "$workdir/duck2api" .
          "$workdir/duck2api" >"$workdir/server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:18083/ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$workdir/server.log"
            echo "Duck2API did not start on the isolated preview port."
            exit 1
          fi

          cat >"$workdir/request.json" <<'JSON'
          {
            "model": "gpt-6-luna",
            "tool_choice": {"type": "mcp", "server_label": "aljam3", "name": "search"},
            "tools": [
              {
                "type": "mcp",
                "server_label": "aljam3",
                "server_url": "https://aljam3.com/mcp",
                "allowed_tools": {"read_only": true},
                "require_approval": "never"
              }
            ],
            "input": "ابحث عن عبارة الأمر الوارد بعد الحظر في نصوص الكتب بالجامع. اكتفِ بنتائج البحث الأولية وبيانات مصادرها، ولا تنقل اقتباسات حرفية."
          }
          JSON

          http_code="$(curl --silent --show-error --max-time 480 \
            -o "$workdir/response.json" -w "%{http_code}" \
            -H "Content-Type: application/json" \
            --data-binary @"$workdir/request.json" \
            http://127.0.0.1:18083/v1/responses || true)"

          if [ "$http_code" != "200" ]; then
            if [ "$http_code" = "502" ] &&
              grep -Fq '[MCP] server="aljam3" tool="search" status="completed"' "$workdir/server.log" &&
              { grep -Fq '429 Too Many Requests' "$workdir/response.json" || grep -Fq 'no x-vqd-hash-1 token' "$workdir/response.json" || grep -Fq "418 I'm a teapot" "$workdir/response.json"; }; then
              echo "::warning::Duck.ai blocked the follow-up model generation after a successful Aljam3 MCP call (rate limit or missing VQD token). The local model end-to-end test remains necessary."
              tail -n 40 "$workdir/server.log" || true
              exit 0
            fi
            echo "Responses MCP orchestration returned HTTP $http_code"
            cat "$workdir/response.json" 2>/dev/null || true
            tail -n 80 "$workdir/server.log" || true
            exit 1
          fi

          python3 - "$workdir/response.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              response = json.load(stream)

          items = response.get("output", [])
          calls = [item for item in items if item.get("type") == "mcp_call"]
          completed = [item for item in calls if item.get("status") == "completed"]
          failed = [item for item in calls if item.get("status") == "failed"]
          messages = [item for item in items if item.get("type") == "message"]
          final_text = response.get("output_text", "")

          print("MCP tool calls:", len(calls))
          print("Completed MCP calls:", len(completed))
          print("Failed MCP calls:", len(failed))
          print("Final answer characters:", len(final_text))

          if not completed:
              raise SystemExit("The model did not complete any live MCP tool call.")
          if not final_text.strip() or not messages:
              raise SystemExit("The Responses API did not return a final assistant message.")
          PY
